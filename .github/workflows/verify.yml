name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Tests
        run: npm test
      - name: Package release
        run: node tools/package_release.mjs
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            reports/load.json
            dist/*.zip
            dist/SHA256SUMS-*.txt
